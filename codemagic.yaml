# Сборка мобильного приложения «Маркет» в облаке Codemagic.
# Mac не нужен: iOS собирается на их mac_mini_m2.
#
# ДВА ПРИЛОЖЕНИЯ, И ЭТО ВРЕМЕННО (ADR 0009, решение владельца 03.09.2026):
#
#   ios-testflight, android-apk   — ОБЁРТКА Capacitor, теги ios-v*,
#   android-play                    android-v*, play-v*. `com.cresca.app`.
#                                   Веб-вью открывает боевой сайт, JS
#                                   внутри нет. Работает сегодня.
#   expo-ios-testflight           — НАТИВНОЕ приложение (Expo) в mobile/,
#                                   тег app-v*. `com.cresca.native`.
#                                   То, что заменит обёртку.
#
# ⚠️ ИДЕНТИФИКАТОРЫ РАЗНЫЕ НАМЕРЕННО. Совпади они — сборка нативного
# заняла бы место обёртки в TestFlight, и работающее приложение исчезло
# бы у всех, у кого оно стоит. Разводятся они ровно до дня, когда
# нативное примут в оба стора: тогда обёртка и все три её процесса
# удаляются одним коммитом (правило 8), а идентификатор при желании
# переносится отдельным шагом.
#
# Правка 05.08.2026 удалила процесс под Capacitor целиком — отменено.
#
# ⚠️ ПРОЦЕССА FLUTTER БОЛЬШЕ НЕТ (03.09.2026, ADR 0008): трек переписан
# на Expo. Собирается он здесь же, а не в EAS — учётная запись Codemagic
# и ключи Apple уже настроены, и заводить вторую сборочную службу ради
# одного приложения незачем.
#
# ⚠️ ВЕРСИИ CAPACITOR ЗДЕСЬ НЕ СЛУЧАЙНЫ: линия 6.2, node 20, `cap add ios`
# без флагов. Это не «старьё, которое надо обновить», а СОЗНАТЕЛЬНОЕ
# приведение к работающему эталону DaKi после четырёх отказавших сборок
# на Capacitor 8.5 + node 24. Поднимать версии — только по одной,
# с проверкой на устройстве после каждой (порядок в КОНСПЕКТЫ М6).
#
# Что настроено в Codemagic ОДИН раз (уже сделано, менять не нужно):
#   • интеграция app_store_connect с именем cresca-app-store-connect
#     (ключ 547STB3RN4, команда MBV78PNGVH)
#   • группа ios_signing: CM_CERTIFICATE_PRIVATE_KEY — постоянный RSA-ключ
#
# Запуск: git tag ios-v1 && git push --tags
#
# Обёртка собирается из корня. Веб в корне ни одним из этих процессов
# не собирается: его собирает Vercel сам. Нативное приложение в mobile/
# (Expo) — тоже не отсюда, см. предупреждение выше.

workflows:
  ios-testflight:
    name: Маркет → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: cresca-app-store-connect  # ключ 547STB3RN4, команда MBV78PNGVH
    environment:
      # НЕ используем environment.ios_signing: он срабатывает ДО генерации
      # iOS-проекта (папки ios/ в репо нет, её создаёт cap add) и падает
      # с "No matching profiles found". Подписываем скриптом ПОСЛЕ cap sync.
      groups:
        - ios_signing
        - push
      vars:
        BUNDLE_ID: com.cresca.app
        APP_NAME: "Маркет"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'ios-v*'
          include: true
    scripts:
      - name: Install JS dependencies
        # npm ci, а НЕ npm install: ставит ровно то, что в package-lock.json,
        # и падает, если lock разошёлся с package.json. Версии @capacitor/*
        # прибиты точками (без ^): обёртка трижды ломалась на смене поведения
        # между минорами, и «свежий минор приехал сам» — не тот сюрприз,
        # который нужен в сборке для магазина.
        script: npm ci --legacy-peer-deps

      - name: Add iOS platform (idempotent)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi

      - name: Sync Capacitor → iOS
        script: npx cap sync ios

      - name: Icons + splash из resources/icon.png
        script: |
          if [ -f "resources/icon.png" ]; then
            npx capacitor-assets generate \
              --iconBackgroundColor "#141417" --iconBackgroundColorDark "#141417" \
              --splashBackgroundColor "#141417" --splashBackgroundColorDark "#141417"
          else
            echo "::error::resources/icon.png отсутствует — Apple отклонит без иконки"; exit 1
          fi

      - name: Ровный тёмный launch-экран без логотипа
        script: |
          # Дефолтный capacitor-assets рисует белый квадрат с логотипом —
          # выглядит дёшево (урок DaKi). Перекрываем своим storyboard.
          cp native-config/LaunchScreen.storyboard ios/App/App/Base.lproj/LaunchScreen.storyboard

      - name: Code signing через App Store Connect API
        script: |
          set -ex
          keychain initialize
          # ПОСТОЯННЫЙ ключ подписи из env. Без него каждый билд плодит новый
          # distribution-сертификат и упирается в лимит Apple — DaKi на этом
          # потерял два билда.
          if [ -z "$CM_CERTIFICATE_PRIVATE_KEY" ]; then
            echo "❌ CM_CERTIFICATE_PRIVATE_KEY не задан. Сгенерируй: openssl genrsa 2048 →"
            echo "   вставь PEM в Codemagic → группа ios_signing (secure)."
            exit 1
          fi
          printf '%s' "$CM_CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --certificate-key=@file:/tmp/cert_key.pem --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Push capability + entitlements
        script: |
          set -e
          cd ios/App
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" App/App.entitlements 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" App/App.entitlements
          # КРИТИЧНО (урок DaKi): привязать entitlements к таргету, иначе файл
          # лежит, но проект на него не ссылается → APNs не выдаёт токен.
          gem install xcodeproj --no-document >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("App.xcodeproj")
            t = proj.targets.find { |x| x.name == "App" }
            abort("App target not found") unless t
            t.build_configurations.each { |c| c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements" }
            proj.save
          '

      - name: Info.plist — камера, Face ID, шифрование
        script: |
          cd ios/App
          # Без purpose-строк приложение крашится на запросе и не проходит ревью.
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Камера потрібна для сканування QR-кодів на ємностях і товарах.'" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Face ID захищає вхід у кабінет вашого закладу.'" App/Info.plist 2>/dev/null || true
          # OneSignal SDK ссылается на location API — строка обязательна (ITMS-90683).
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Локація може використовуватись для релевантних сповіщень.'" App/Info.plist 2>/dev/null || true
          # Только стандартный HTTPS — снимает вопрос Missing Compliance в TestFlight.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist 2>/dev/null || true
          # Пуш будит приложение в фоне. Без этого ключа cap sync ругается
          # («Configuration required for onesignal-cordova-plugin»), а тихие
          # пуши и доставка при свёрнутом приложении не работают вовсе.
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" App/Info.plist
          # ── ТОЛЬКО ВЕРТИКАЛЬНО НА ТЕЛЕФОНЕ ──────────────────────────
          # Решение владельца 25.08.2026: «удали возможность поворота
          # экрана, наше приложение только вертикальное на телефоне».
          #
          # Массив ПЕРЕСОЗДАЁТСЯ (Delete + Add), а не дополняется: `cap add
          # ios` кладёт в шаблон все четыре ориентации, и `Add` поверх
          # существующего массива молча ничего не делает — landscape остался
          # бы на месте, а лог выглядел бы успешным.
          #
          # ⚠️ У iPAD ОСТАЮТСЯ ВСЕ ЧЕТЫРЕ, И ЭТО НЕ НЕБРЕЖНОСТЬ.
          # Первая версия ставила `~ipad` в один Portrait — «раз вертикально,
          # то везде». App Store Connect отбил загрузку целиком:
          #
          #   ITMS-90474: The “UIInterfaceOrientationPortrait” orientations
          #   were provided … but you need to include all of the … four
          #   orientations to support iPad multitasking.
          #
          # Универсальное приложение ОБЯЗАНО поддерживать многозадачность
          # iPad, а она требует все четыре. Обойти это раньше позволял
          # `UIRequiresFullScreen`, но в SDK iOS 26 (здесь Xcode 26.x) его
          # больше нет. Остаются ровно два честных пути: дать iPad четыре
          # ориентации — или сделать приложение ТОЛЬКО для iPhone
          # (`TARGETED_DEVICE_FAMILY = 1`), и тогда ключа `~ipad` не нужно
          # вовсе. Выбран первый: он ничего не отнимает у уже собранного
          # и не трогает состав устройств.
          #
          # Требование владельца при этом выполнено полностью: `~ipad`
          # действует ТОЛЬКО на iPad, а телефон читает ключ без суффикса —
          # и там по-прежнему один Portrait.
          #
          # Не «чинить» это обратно в один Portrait: сборка снова соберётся,
          # снова дойдёт до публикации и снова упадёт — уже после четырёх
          # минут ожидания.
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" App/Info.plist
          # Печатаем ОБА ключа: телефонный обязан остаться одной строкой,
          # планшетный — четырьмя. Один `Print` показывал только первый,
          # и промах в `~ipad` был не виден в журнале сборки вовсе.
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" App/Info.plist

      - name: Глубокие ссылки — схема cresca://
        script: |
          cd ios/App
          # Без этой схемы вход через Apple и Google не возвращается
          # в приложение ВООБЩЕ: системный браузер получает от
          # /auth/callback ссылку cresca://auth?code=… и, не найдя,
          # кто её обслуживает, просто показывает ошибку.
          # Этой же схемой открываются тапы по пушам.
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string $BUNDLE_ID" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string cresca" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" App/Info.plist

      - name: Universal Links (только если возможность включена в Apple)
        script: |
          cd ios/App
          # Associated Domains добавляется ТОЛЬКО по флагу. Причина
          # жёсткая: если в App ID возможность не включена, профиль
          # её не содержит, и подпись падает — билд теряется целиком.
          #
          # Порядок включения, когда дойдут руки:
          #   1. developer.apple.com → Identifiers → com.cresca.app →
          #      поставить галочку Associated Domains;
          #   2. в Codemagic задать IOS_ASSOCIATED_DOMAINS=1;
          #   3. файл /.well-known/apple-app-site-association уже отдаётся.
          # ПЕРВЫМ идёт www, и это принципиально: Apple тянет
          # /.well-known/apple-app-site-association с УКАЗАННОГО хоста
          # и ЗА РЕДИРЕКТОМ НЕ ИДЁТ. Апекс cres-ca.com отдаёт 308 на www
          # (основной домен в Vercel), поэтому applinks:cres-ca.com
          # в одиночку не работает — файл Apple просто не получит.
          # Апекс оставлен вторым на случай снятия редиректа.
          if [ "${IOS_ASSOCIATED_DOMAINS:-0}" = "1" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains array" App/App.entitlements 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains:0 string applinks:www.cres-ca.com" App/App.entitlements 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains:1 string webcredentials:www.cres-ca.com" App/App.entitlements 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains:2 string applinks:cres-ca.com" App/App.entitlements 2>/dev/null || true
            echo "OK: Universal Links включены"
          else
            echo "Universal Links пропущены (IOS_ASSOCIATED_DOMAINS != 1) — схема cresca:// работает и без них"
          fi

      - name: Build number = секунды эпохи
        script: |
          cd ios/App
          # ── НОМЕР СБОРКИ: СЕКУНДЫ ЭПОХИ ───────────────────────────────
          #
          # Отказ 18.08.2026: публикация в TestFlight упала с
          # ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE —
          # «The bundle version must be higher than the previously
          # uploaded version: 101», previousBundleVersion = 101.
          # Счётчик Codemagic был на пятёрке: приложение в Codemagic
          # заводили заново, счётчик начался с нуля, а в App Store
          # Connect уже лежала сотня с лишним. Сборка собралась,
          # упала ТОЛЬКО отправка.
          #
          # Почему не `app-store-connect get-latest-app-store-build-number`:
          # для билда «в проверке» он возвращает 1 и ломает публикацию
          # тем же дубликатом (урок DaKi). Спрашивать Apple о номере —
          # значит зависеть от его настроения.
          #
          # Секунды эпохи не зависят ни от счётчика, ни от Apple: число
          # монотонно растёт само по себе и заведомо больше любого
          # прошлого. Помещается в UInt32 (предел CFBundleVersion)
          # до 2106 года.
          BN="$(date +%s)"
          agvtool new-version -all "$BN"

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups не указываем: внутренним тестировщикам билды раздаются
        # автоматически, а назначить внутреннюю группу через API нельзя (урок DaKi).

  android-apk:
    name: Маркет → Android APK (проверка на своём телефоне)
    # linux_x2 недоступен на бесплатном тарифе — mac_mini_m2 собирает Android
    # так же (в образе есть SDK+JDK), проверено на DaKi.
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups: [push]
      vars:
        BUNDLE_ID: com.cresca.app
        APP_NAME: "Маркет"
      node: 20
      java: 21
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'android-v*'
          include: true
    scripts:
      - name: Install JS dependencies
        # npm ci, а НЕ npm install: ставит ровно то, что в package-lock.json,
        # и падает, если lock разошёлся с package.json. Версии @capacitor/*
        # прибиты точками (без ^): обёртка трижды ломалась на смене поведения
        # между минорами, и «свежий минор приехал сам» — не тот сюрприз,
        # который нужен в сборке для магазина.
        script: npm ci --legacy-peer-deps
      - name: Add Android platform (idempotent)
        script: |
          if [ ! -d "android" ]; then npx cap add android; fi
      - name: google-services.json (FCM push)
        script: |
          # Постоянная копия живёт в native-config/ — папка android/ пересоздаётся.
          if [ -f "native-config/google-services.json" ]; then
            cp native-config/google-services.json android/app/google-services.json
          else
            echo "::warning::native-config/google-services.json нет — Android-пуш работать не будет"
          fi
      - name: Sync Capacitor → Android
        script: npx cap sync android
      - name: Патч натива (разрешения, OneSignal, биометрия, назад)
        script: bash scripts/patch-android.sh
      - name: Icons + splash
        script: |
          if [ -f "resources/icon.png" ]; then
            npx capacitor-assets generate --android \
              --iconBackgroundColor "#141417" --iconBackgroundColorDark "#141417" \
              --splashBackgroundColor "#141417" --splashBackgroundColorDark "#141417"
          fi
      - name: Build debug APK
        script: |
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients: [daniilpadalko97@gmail.com]
        notify: { success: true, failure: true }

  android-play:
    name: Маркет → Google Play (.aab, подписанный)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups: [push, android_signing]
      vars:
        BUNDLE_ID: com.cresca.app
      node: 20
      java: 21
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'play-v*'
          include: true
    scripts:
      - name: Install JS dependencies
        # npm ci, а НЕ npm install: ставит ровно то, что в package-lock.json,
        # и падает, если lock разошёлся с package.json. Версии @capacitor/*
        # прибиты точками (без ^): обёртка трижды ломалась на смене поведения
        # между минорами, и «свежий минор приехал сам» — не тот сюрприз,
        # который нужен в сборке для магазина.
        script: npm ci --legacy-peer-deps
      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then npx cap add android; fi
      - name: google-services.json
        script: |
          if [ -f "native-config/google-services.json" ]; then
            cp native-config/google-services.json android/app/google-services.json
          fi
      - name: Sync + патч натива
        script: |
          npx cap sync android
          bash scripts/patch-android.sh
      - name: Icons + splash
        script: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor "#141417" --iconBackgroundColorDark "#141417" \
            --splashBackgroundColor "#141417" --splashBackgroundColorDark "#141417"
      - name: Release keystore из env
        script: |
          # Логика в scripts/patch-android-signing.sh: heredoc внутри YAML
          # ломается на отступах (урок DaKi), поэтому только вызов скрипта.
          bash scripts/patch-android-signing.sh
      - name: Версия = секунды эпохи
        script: |
          # Та же причина, что и у iOS выше: счётчик Codemagic начался
          # заново и оказался НИЖЕ уже опубликованного номера. Google
          # так же требует строго растущий versionCode.
          # Предел versionCode — 2100000000, секунд эпохи хватает до 2036;
          # когда упрёмся, переходить на «минуты эпохи».
          BN="$(date +%s)"
          perl -0pi -e "s{versionCode \d+}{versionCode $BN}" android/app/build.gradle
      - name: Build AAB
        script: |
          cd android && chmod +x ./gradlew && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients: [daniilpadalko97@gmail.com]
        notify: { success: true, failure: true }

  # ── НАТИВНОЕ ПРИЛОЖЕНИЕ (Expo) → TestFlight ───────────────────────────────
  #
  # Отдельный процесс, а не правка того, что выше: обёртка и нативное
  # приложение — РАЗНЫЕ приложения с разными идентификаторами, и собираются
  # они по-разному. Обёртка синхронизируется `cap sync`, здесь — `expo
  # prebuild`, который генерирует папку `ios/` из `app.json`.
  #
  # ⚠️ ИДЕНТИФИКАТОР ДРУГОЙ, И ЭТО ГЛАВНОЕ. У обёртки `com.cresca.app`,
  # здесь `com.cresca.native`. Совпади они — новая сборка заняла бы место
  # обёртки в TestFlight, то есть работающее приложение исчезло бы у всех,
  # у кого оно стоит. Пока нативное не принято в сторах, они живут
  # параллельно (ADR 0009).
  #
  # ⚠️ ПАПКИ `ios/` В РЕПОЗИТОРИИ НЕТ И НЕ ДОЛЖНО БЫТЬ. Её создаёт
  # `expo prebuild` на каждой сборке из `app.json` — это и есть способ
  # Expo держать нативную часть (continuous native generation). Закоммитить
  # её значит завести второй источник правды об иконках, версии и правах:
  # правку в `app.json` тогда пришлось бы дублировать руками в Xcode-проекте.
  #
  # Что нужно ОДИН раз до первой сборки, кодом это не делается:
  #   1. App Store Connect → Мои приложения → «+» → новое приложение
  #      с идентификатором `com.cresca.native`. Без записи приложения
  #      выгрузка в TestFlight отвечает «app not found».
  #   2. Больше ничего: сертификат и профиль создаст сама сборка через
  #      интеграцию `cresca-app-store-connect` и постоянный ключ
  #      `CM_CERTIFICATE_PRIVATE_KEY` из группы `ios_signing` — те же,
  #      что у обёртки.
  #
  # Запуск: git tag app-v1 && git push --tags
  expo-ios-testflight:
    name: CRES-CA (нативное) → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: cresca-app-store-connect
    environment:
      # `ios_signing` — ради постоянного CM_CERTIFICATE_PRIVATE_KEY.
      # Группа `push` не нужна: пушей в нативном приложении пока нет,
      # а лишняя группа в сборке — это лишний секрет в окружении.
      groups:
        - ios_signing
      vars:
        WORKDIR: mobile
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'app-v*'
          include: true
    scripts:
      - name: Зависимости
        # `npm ci`, а не `install`: ставит ровно то, что в package-lock.json.
        # Флаг совместимости пиров лежит в `mobile/.npmrc` и потому здесь
        # не повторяется — иначе он жил бы в двух местах и разошёлся.
        script: cd "$WORKDIR" && npm ci

      - name: Генерация iOS-проекта из app.json
        script: |
          cd "$WORKDIR"
          npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods
        script: cd "$WORKDIR/ios" && pod install

      - name: Подпись через App Store Connect API
        script: |
          set -ex
          cd "$WORKDIR"
          # Идентификатор читается ИЗ app.json, а не задаётся здесь второй
          # раз: разойдись эти две записи — сборка подписалась бы одним
          # приложением, а собралась другим, и ошибка приехала бы аж
          # при выгрузке.
          BUNDLE_ID="$(node -p "require('./app.json').expo.ios.bundleIdentifier")"
          echo "Идентификатор: $BUNDLE_ID"
          keychain initialize
          # ПОСТОЯННЫЙ ключ подписи. Без него каждая сборка плодит новый
          # distribution-сертификат и упирается в лимит Apple (урок DaKi).
          if [ -z "$CM_CERTIFICATE_PRIVATE_KEY" ]; then
            echo "❌ CM_CERTIFICATE_PRIVATE_KEY не задан — группа ios_signing"
            exit 1
          fi
          printf '%s' "$CM_CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --certificate-key=@file:/tmp/cert_key.pem --create
          keychain add-certificates
          cd ios && xcode-project use-profiles

      - name: Номер сборки = секунды эпохи
        script: |
          cd "$WORKDIR/ios"
          # Та же причина, что у обёртки: счётчик Codemagic может оказаться
          # НИЖЕ уже выгруженного номера, а Apple требует строго растущий.
          agvtool new-version -all "$(date +%s)"

      - name: Сборка .ipa
        script: |
          cd "$WORKDIR"
          # Имя схемы НЕ пишем строкой: `expo prebuild` образует его из
          # `expo.name`, и переименование приложения тихо сломало бы сборку.
          # Берём имя у .xcodeproj, а НЕ у .xcworkspace: workspace
          # появляется только после `pod install`, и проверить эту строку
          # без запуска CocoaPods было бы нельзя. Проект есть сразу после
          # prebuild — на нём и проверено (имя схемы: CRESCA).
          SCHEME="$(basename ios/*.xcodeproj .xcodeproj)"
          echo "Схема: $SCHEME"
          xcode-project build-ipa \
            --workspace "ios/$SCHEME.xcworkspace" \
            --scheme "$SCHEME"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups не указываем: внутренним тестировщикам билды раздаются
        # автоматически, а назначить внутреннюю группу через API нельзя.
      email:
        recipients: [daniilpadalko97@gmail.com]
        notify: { success: true, failure: true }
