name: Перевірка копії відновленням

# Шаг 1, пункт Г. Раз в месяц копия РАЗВОРАЧИВАЕТСЯ и проверяется —
# иначе она не копия, а надежда. Разбор проверок — в scripts/backup-verify.sh.
#
# Отдельный процесс, а не шаг внутри копирования, по одной причине:
# здесь нужна ЗАКРЫТАЯ половина ключа шифрования, а в ежедневном
# копировании её быть не должно. Так утечка секретов ежедневного процесса
# не означает утечку всех прошлых копий.

on:
  schedule:
    - cron: '0 4 2 * *'   # второе число месяца, после месячной копии первого
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Чистая база живёт в самом запуске и умирает вместе с ним. Разворачивать
      # копию в боевую или проверочную базу нельзя категорически: проверка
      # начинается с `drop schema public cascade`.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Інструменти
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age

          # Каталог 17 — первым в PATH. Разбор, почему обёртки `/usr/bin/pg_dump`
          # недостаточно, — в backup.yml: она отдаёт 16 и роняет дамп базы 17.6.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Перевірити версію pg_dump
        run: |
          set -euo pipefail
          pg_dump --version
          pg_dump --version | grep -q ' 17\.' || {
            echo "::error::pg_dump не 17"
            exit 1
          }

      - name: Розгорнути й перевірити
        env:
          BACKUP_AGE_PRIVATE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Нужен для ОСЛАБЛЕННОГО пути: когда закрытого ключа и ключей R2
          # ещё нет, проверка снимает свежий дамп и разворачивает его.
          # Разбор, что при этом проверяется, а что нет, — в самом скрипте.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERIFY_DB_URL: postgresql://postgres:verify@localhost:5432/verify
        run: bash scripts/backup-verify.sh

      # Результат объявляется и когда сошлось, и когда нет. Отчёт только
      # об отказах приучает считать тишину хорошей новостью, а тишина
      # бывает и оттого, что процесс перестал запускаться вовсе.
      #
      # Успех — строкой в сводке запуска. Провал — задачей в репозитории:
      # она не требует секретов, и GitHub сам оповестит владельца.
      # Письмо через Resend остаётся дополнительным путём.
      - name: Повідомити про результат
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'daniilpadalko97@gmail.com' }}
          OK: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "$OK" = "success" ]; then
            SUBJ="Копія перевірена відновленням — усе гаразд"
            BODY="Перевірка пройшла: копія розгортається, дані на місці, залишок сходиться з журналом.

          Запуск: $RUN_URL"
            echo "## $SUBJ" >> "$GITHUB_STEP_SUMMARY"
          else
            SUBJ="УВАГА: копія НЕ відновлюється"
            BODY="Перевірка провалилась. Це означає, що відновитись із копії зараз НЕ вийде. Дивитись сьогодні.

          Запуск: $RUN_URL"
            gh issue create --title "$SUBJ" --body "$BODY" --label "копії" 2>/dev/null \
              || gh issue create --title "$SUBJ" --body "$BODY"
          fi

          [ -n "${RESEND_API_KEY:-}" ] || exit 0
          jq -n --arg to "$ALERT_EMAIL" --arg s "$SUBJ" --arg text "$BODY" \
            '{from:"CRESKO <no-reply@cres-ca.com>", to:[$to], subject:$s, text:$text}' \
          | curl -sS -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @- >/dev/null
