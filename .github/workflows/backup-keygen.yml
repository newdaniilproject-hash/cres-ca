name: Ключ шифрування копій (один раз)

# Запускается ВРУЧНУЮ и один раз в жизни проекта. Создаёт пару ключей `age`
# для шифрования резервных копий.
#
# ── Почему ключ рождается здесь, а не у разработчика ──────────────────────
#
# Закрытая половина ключа — это доступ ко всем копиям сразу. Она не должна
# существовать ни в репозитории, ни в переписке, ни на машине того, кто
# пишет код. Поэтому:
#
#   • пара создаётся внутри одноразового запуска и умирает вместе с ним;
#   • ОТКРЫТАЯ половина печатается в отчёт запуска — её можно показывать
#     кому угодно, зашифровать ею можно, прочитать нельзя;
#   • ЗАКРЫТАЯ уходит одним письмом владельцу и НИГДЕ БОЛЬШЕ не появляется:
#     ни в журнале запуска, ни в файлах сборки.
#
# ── Что делать владельцу после запуска ────────────────────────────────────
#
# 1. Открытую половину вставить в секрет BACKUP_AGE_PUBLIC_KEY.
# 2. Закрытую из письма — в секрет BACKUP_AGE_PRIVATE_KEY (её читает
#    только месячная проверка восстановлением).
# 3. Закрытую сохранить ВНЕ обоих хранилищ копий: менеджер паролей плюс
#    бумага в сейфе. Потерянный ключ означает, что копии есть и они
#    нечитаемы — это то же самое, что копий нет.
# 4. Письмо из почты удалить.
#
# Повторный запуск создаст НОВУЮ пару, и копии, снятые старой, перестанут
# читаться этой. Менять ключ можно, но старую закрытую половину при этом
# надо хранить столько же, сколько живут снятые ею копии — год.

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Створити пару ключів
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL || 'daniilpadalko97@gmail.com' }}
        run: |
          set -euo pipefail
          [ -n "$RESEND_API_KEY" ] || { echo "нет секрета RESEND_API_KEY — закрытый ключ отправить нечем"; exit 1; }
          [ -n "$ALERT_EMAIL" ]    || { echo "нет секрета ALERT_EMAIL — некуда отправлять"; exit 1; }

          sudo apt-get update -qq && sudo apt-get install -y -qq age

          age-keygen -o key.txt 2>/dev/null
          PUB="$(grep 'public key:' key.txt | sed 's/.*public key: //')"

          # Открытую — в отчёт. Её видно всем, у кого есть доступ к репозиторию,
          # и это нормально: зашифровать можно, расшифровать нельзя.
          {
            echo "## Відкритий ключ"
            echo
            echo "Вставте це значення в секрет \`BACKUP_AGE_PUBLIC_KEY\`:"
            echo
            echo '```'
            echo "$PUB"
            echo '```'
            echo
            echo "Закритий ключ надіслано листом на **$ALERT_EMAIL**."
            echo "У журналі запуску його немає і не буде."
          } >> "$GITHUB_STEP_SUMMARY"

          # Закрытую — одним письмом и никуда больше. jq собирает JSON,
          # чтобы перенос строки в ключе не сломал тело запроса.
          jq -n --arg to "$ALERT_EMAIL" --arg key "$(cat key.txt)" \
            '{from:"CRESKO <no-reply@cres-ca.com>", to:$to,
              subject:"Закритий ключ шифрування резервних копій — зберегти й видалити лист",
              text:("Це ЄДИНА копія закритого ключа. Він розшифровує всі резервні копії бази.\n\nЩо зробити зараз:\n1. Вставити його в секрет BACKUP_AGE_PRIVATE_KEY у GitHub.\n2. Зберегти в менеджері паролів І на папері.\n3. Видалити цей лист.\n\nВтрачений ключ = копії є, але прочитати їх неможливо.\nЗберігати НЕ там, де лежать самі копії.\n\n" + $key)}' \
          | curl -sS -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @- >/dev/null

          # Затираем и файл, и переменные: журнал запуска сохраняется,
          # рабочая папка — нет, но осторожность здесь дешевле ошибки.
          shred -u key.txt 2>/dev/null || rm -f key.txt
          echo "✔ пара створена, відкритий ключ у звіті, закритий — листом"
