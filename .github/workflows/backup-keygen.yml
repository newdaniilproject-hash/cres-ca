name: Ключ шифрування копій (один раз)

# Запускается ВРУЧНУЮ и один раз в жизни проекта. Создаёт пару ключей `age`
# для шифрования резервных копий.
#
# ── Что изменилось и почему ───────────────────────────────────────────────
#
# Прежняя редакция слала закрытую половину письмом через Resend. Это
# требовало, чтобы ДО первого ключа уже был заведён секрет RESEND_API_KEY,
# — то есть чтобы владелец сделал одно ручное действие ради другого ручного
# действия. На этой лестнице всё и стояло: ключа нет → копии не шифруются →
# копий нет вовсе.
#
# Теперь задание не требует НИ ОДНОГО секрета:
#
#   • ОТКРЫТАЯ половина — не секрет по своей природе: ею можно только
#     зашифровать. Задание само кладёт её в файл `backup-recipient.age.pub`
#     и само делает коммит. Владельцу не надо ничего никуда вставлять.
#   • ЗАКРЫТАЯ половина уходит ФАЙЛОМ СБОРКИ со сроком жизни в сутки.
#     В журнал запуска она не печатается ни строкой.
#
# ── Что делать владельцу после запуска ────────────────────────────────────
#
# 1. Открыть запуск → раздел Artifacts → скачать `zakrytyi-kliuch`.
# 2. Содержимое положить в менеджер паролей И на бумагу. Это ЕДИНСТВЕННАЯ
#    копия: потерянный ключ означает, что копии есть и они нечитаемы —
#    то же самое, что копий нет.
# 3. Хранить НЕ там, где лежат сами копии.
# 4. Файл сборки удалить сразу после скачивания (кнопка корзины рядом
#    с ним). Через сутки он исчезнет сам, но сутки — это сутки.
# 5. Позже, для месячной проверки восстановлением, тот же ключ вставить
#    в секрет BACKUP_AGE_PRIVATE_KEY. Без него проверка работает по
#    ослабленному пути — см. scripts/backup-verify.sh.
#
# Повторный запуск создаст НОВУЮ пару, и копии, снятые старой, перестанут
# читаться этой. Менять ключ можно, но старую закрытую половину при этом
# надо хранить столько же, сколько живут снятые ею копии — год.

on:
  workflow_dispatch:
    inputs:
      replace:
        description: 'Написати replace, щоб ЗАМІНИТИ наявний ключ'
        required: false
        default: ''

permissions:
  # Нужно ровно для одного: положить в репозиторий открытую половину.
  contents: write

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Створити пару ключів
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq age

          # Замена ключа — действие с последствиями: копии, снятые старой
          # парой, перестают читаться новой. Поэтому случайно её сделать
          # нельзя, а осознанно — можно, написав слово в поле запуска.
          # Прежняя редакция требовала руками удалить файл из репозитория,
          # и это оказалось хуже: замена ключа — штатная операция при его
          # раскрытии, а удаление файлов ради неё — лишний риск.
          if [ -s backup-recipient.age.pub ] && grep -q '^age1' backup-recipient.age.pub; then
            if [ "${{ github.event.inputs.replace }}" != "replace" ]; then
              echo "::error::Ключ уже існує. Щоб замінити — запустіть ще раз і впишіть replace."
              echo "Копії, зняті старою парою, після заміни стануть нечитаними."
              exit 1
            fi
            echo "::warning::Ключ ЗАМІНЮЄТЬСЯ. Старі копії стануть нечитаними."
          fi

          age-keygen -o key.txt 2>/dev/null
          PUB="$(grep 'public key:' key.txt | sed 's/.*public key: //')"

          # Файл получателя. Комментарий внутри файла — чтобы тот, кто
          # наткнётся на него в репозитории, не принял его за утечку.
          {
            echo "# Відкрита половина ключа age для резервних копій."
            echo "# Нею можна ЗАШИФРУВАТИ і НЕ МОЖНА прочитати. Це не секрет."
            echo "# Закрита половина — у власника, у репозиторії її немає."
            echo "$PUB"
          } > backup-recipient.age.pub

      - name: Закритий ключ — файлом складання
        uses: actions/upload-artifact@v4
        with:
          name: zakrytyi-kliuch
          path: key.txt
          retention-days: 1

      - name: Покласти відкриту половину в репозиторій
        run: |
          set -euo pipefail
          # Ключ затираем СРАЗУ после выгрузки и ДО коммита: так его
          # физически нет в рабочей папке в момент, когда git смотрит,
          # что добавлять.
          shred -u key.txt 2>/dev/null || rm -f key.txt

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add backup-recipient.age.pub
          git commit -m 'Ключ шифрування копій: відкрита половина'
          git push

      - name: Що робити далі
        run: |
          {
            echo "## Пара ключів створена"
            echo
            echo "**Відкриту половину** покладено в репозиторій файлом"
            echo '`backup-recipient.age.pub`. Резервне копіювання підхопить її саме.'
            echo
            echo "**Закриту половину** заберіть у розділі **Artifacts** цього запуску"
            echo '(файл `zakrytyi-kliuch`), покладіть у менеджер паролів і на папір,'
            echo "а сам файл видаліть. Через добу він зникне сам."
            echo
            echo "У журналі запуску закритого ключа немає і не буде."
          } >> "$GITHUB_STEP_SUMMARY"
