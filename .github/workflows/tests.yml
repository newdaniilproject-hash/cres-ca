name: Міграції й заборони

# Шаг 2, пункт А — проверочная база. В плане она описана как «отдельная
# среда»; здесь она сделана ОДНОРАЗОВОЙ и бесплатной, и это осознанный
# размен, а не экономия ради экономии.
#
# ── Что именно проверяется ────────────────────────────────────────────────
#
# На чистый Postgres накатываются ВСЕ миграции по порядку, с нуля, и по ним
# прогоняются восемь наборов запретов: права, склад, заказы, записи,
# соответствие, изоляция арендаторов, регистрация, довесок по складу.
#
# Ценность не в тестах как таковых, а в том, что миграции применяются
# С НУЛЯ. Прод накатывает их по одной и никогда не проверяет, соберётся ли
# схема заново. Именно так теряются миграции (0057 и 0058 уехали на базу
# мимо репозитория) и именно так рождаются файлы, которые применяются
# только поверх уже существующего состояния.
#
# ── Почему не постоянная проверочная база в Supabase ──────────────────────
#
# Ветка Supabase — это деньги каждый месяц и ещё одна база, за которой надо
# следить. Одноразовый Postgres в задании даёт главное — прогон миграций
# с нуля до коммита — и стоит ноль. Когда понадобится проверять то, чего
# в чистом Postgres нет (настоящие политики хранилища, настоящий pg_cron),
# ветку заводят отдельным решением, а не «на всякий случай».
#
# Правило приёмки: правка миграций без зелёного прогона не принимается.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  workflow_dispatch:

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Накотити міграції з нуля й прогнати заборони
        # ── Почему через sudo ─────────────────────────────────────────────
        #
        # Стенд поднимает свой Postgres и рассчитывает на суперпользователя
        # `postgres`: миграции создают объекты от его имени, тесты входят
        # через `set role`. Задание GitHub идёт от пользователя `runner`,
        # и `initdb` в этом случае делает суперпользователем ЕГО — роли
        # `postgres` не существует вовсе, первый же psql падает с «role
        # postgres does not exist». Проверено первым прогоном.
        #
        # Под root у run.sh уже есть верная ветка: он переключается на
        # `postgres` сам. Заодно снимается вопрос прав на каталог
        # расширений, куда кладутся заглушки pg_cron и pg_net.
        run: sudo -E bash supabase/tests/run.sh
