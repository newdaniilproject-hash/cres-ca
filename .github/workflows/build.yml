name: Збірка

# ── Зачем это задание, если сборку и так делает Vercel ────────────────────
#
# Затем, что Vercel собирает УЖЕ РАЗВЁРНУТОЕ. Его «красная» сборка означает,
# что боевой домен несколько минут отдавал предыдущую версию, а разработчик
# узнал о поломке из письма о неудачном деплое. 16.08.2026 так и вышло:
# три производственных деплоя подряд легли красными, потому что файл,
# на который ссылались уже залитые, ехал следующим коммитом.
#
# Здесь сборка идёт ДО и НЕЗАВИСИМО: обычный раннер, обычный `npm ci`,
# обычные `tsc` и `next build`. Задание не заменяет Vercel — оно даёт
# честный ответ «этот коммит собирается» там, где ответ Vercel уже поздно.
#
# ── Почему отдельным шагом tsc, если next build и так проверяет типы ─────
#
# `next build` печатает ПЕРВУЮ ошибку типов и останавливается. `tsc --noEmit`
# проходит ВСЁ дерево и печатает все ошибки разом. Когда правка задела
# десять файлов, разница между «одна ошибка за прогон» и «список» — это
# разница между часом и пятью минутами.
#
# ── Почему tsc идёт ПОСЛЕ сборки, а не до ────────────────────────────────
#
# Потому что до сборки он не может пройти вообще. `next-env.d.ts` в этой
# версии Next заканчивается двумя строками:
#
#     import "./.next/types/routes.d.ts";
#     import "./.next/types/root-params.d.ts";
#
# Эти файлы РОЖДАЕТ `next build`, а `.next/` в `.gitignore`. На чистой
# выкачке их нет, и `tsc --noEmit` падает на «Cannot find module
# './.next/types/routes.d.ts'» — то есть задание краснело бы на каждом
# запуске, ни разу не дойдя до настоящих ошибок. Локально этого не видно:
# там `.next/` остался от прошлого `next dev`.
#
# `if: !cancelled()` на шаге типов — чтобы список ошибок печатался и тогда,
# когда сборка уже упала на первой из них. Ради этого шаг и заведён.
#
# ── Почему нет кеша node_modules ─────────────────────────────────────────
#
# `setup-node` с `cache: npm` кеширует ЗАГРУЗКУ пакетов, а не саму папку,
# и этого достаточно: установка занимает секунды. Кеш самой `node_modules`
# однажды сохраняет сломанное состояние и потом воспроизводит его каждый
# прогон — отладка такого стоит дороже сэкономленной минуты.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Встановити залежності
        # `npm ci`, а не `npm install`: ci ставит РОВНО то, что записано
        # в package-lock.json, и падает при расхождении с package.json.
        # `install` тихо обновил бы зависимости, и тогда зелёная сборка
        # здесь ничего не говорила бы о сборке на Vercel.
        run: npm ci

      - name: Збірка
        shell: bash
        env:
          # Сборке нужны только ПУБЛИЧНЫЕ переменные — те, что попадают
          # в клиентский код. Служебные ключи здесь не нужны и намеренно
          # не передаются: сборка не должна иметь доступа к базе.
          #
          # ── Почему у КАЖДОЙ строки есть запасное значение ────────────────
          #
          # Оба значения публичны по устройству Supabase (разбор —
          # в lib/supabase/config.ts) и оба уже лежат в репозитории тем же
          # текстом. Секрет здесь ничего не защищает, а вот его ОТСУТСТВИЕ
          # ломало бы задание: `${{ secrets.X }}` при незаведённом секрете
          # даёт не «переменной нет», а ПУСТУЮ СТРОКУ, и `??` в config.ts
          # её не ловит — пустая строка не null.
          #
          # Дальше это падает не тихо: `app/(auth)/login/page.tsx` — 'use
          # client' без данных, значит Next разбирает его на сборке, а
          # `createClient()` там зовётся прямо в теле компонента. Клиент
          # с пустым ключом бросает «supabaseKey is required» — и задание
          # краснеет на каждом запуске, сообщая о поломке, которой нет.
          #
          # Это же требование CLAUDE.md, «Что настраивается руками», п. 7:
          # обязателен ровно один секрет — SUPABASE_DB_URL. Задание, которое
          # требует второй, нарушает объявленный договор о настройке.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://jobvstdwoyifspaiwazn.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_9WvSKed5ELlCfrno_L3D-Q_L5rH4Wtk' }}
          NEXT_PUBLIC_SITE_URL: https://cres-ca.com
        run: npm run build 2>&1 | tail -n 80 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Типи
        # Идёт после сборки: до неё нет `.next/types/*`, на которые
        # ссылается `next-env.d.ts` — разбор в шапке файла.
        # `!cancelled()`, а не `always()`: отменённый вручную запуск не
        # должен дорабатывать шаги.
        if: ${{ !cancelled() }}
        shell: bash
        run: npx tsc --noEmit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # Одна задача на одну поломку, а не по одной на каждый коммит.
      # Тот же приём, что у сторожа: поток одинаковых задач читается как
      # шум и перестаёт читаться именно тогда, когда нужен.
      - name: Задача про зламану збірку
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="Збірка main не проходить"
          OPEN="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          BODY="Коміт ${{ github.sha }} не збирається.

          Це означає, що бойовий домен зараз віддає попередню версію.

          Запуск: $RUN_URL"
          if [ -n "${OPEN:-}" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
