name: Сторож

# Шаг 2, пункт В. Внешняя проверка боевого сайта и базы.
# Что именно проверяется и почему так — в scripts/health.sh.
#
# ── Почему проверка живёт ВНЕ Vercel ──────────────────────────────────────
#
# Сторож, стоящий на том же хостинге, что и приложение, падает вместе
# с ним и молчит именно в аварии. Раннеры GitHub — другая машина, другая
# сеть, другой поставщик.
#
# ── Почему не каждую минуту ───────────────────────────────────────────────
#
# План просил «каждую минуту». Расписание GitHub этого честно не даёт:
# минимальный шаг — пять минут, и он не гарантируется, задание встаёт
# в общую очередь и может опоздать на десяток минут. Обещать минуту здесь
# значит обещать то, чего нет. Взято пятнадцать: это тот срок, за который
# авария всё ещё замечается раньше клиента, и при этом почта не тонет
# в повторных письмах. Если понадобится настоящая минута — это внешний
# сторож (UptimeRobot и подобные), отдельное решение и отдельные деньги.
#
# ── Про повторные письма ──────────────────────────────────────────────────
#
# Пока авария не устранена, письмо приходит каждые пятнадцать минут.
# Это сделано намеренно: сторож, замолкающий после первого письма,
# однажды промолчит и про вторую аварию.
#
# ⚠️ Расписание GitHub ОТКЛЮЧАЕТСЯ САМО после 60 дней без коммитов
# в репозиторий. Для сторожа это худший из отказов — он перестаёт
# работать беззвучно. Если в проекте наступит затишье, проверить вручную:
# Actions → Сторож → есть ли запуски за последние сутки.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/health.sh'
      - '.github/workflows/health.yml'

concurrency:
  # Опоздавшее задание не должно наслаиваться на следующее.
  group: health
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Клієнт Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Перевірити
        id: check
        # `shell: bash` здесь ОБЯЗАТЕЛЕН, и это не украшение.
        # Без него шаг выполняется как `bash -e` — БЕЗ pipefail, и код
        # возврата конвейера берётся у последней команды, то есть у `tee`.
        # Проверка падала, а задание сообщало «Success». Так и случилось
        # в первом же прогоне: в сводке стояло «Відмов: 2», а метка была
        # зелёная. Сторож, который врёт зелёным, вреднее отсутствующего.
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/health.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Лист про відмову
        # Проверка ключей — внутри шага, а не в условии: контекст `secrets`
        # в условиях шагов недоступен, а `env` там не видит собственный
        # блок env этого же шага. Условие, которое молча всегда истинно
        # или всегда ложно, хуже отсутствующего.
        #
        # Без ключей письма нет, и это не тупик: GitHub сам шлёт владельцу
        # репозитория письмо о каждом упавшем задании по расписанию.
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ALERT_EMAIL:-}" ]; then
            echo "RESEND_API_KEY або ALERT_EMAIL не задано — лист не надсилаю"
            exit 0
          fi
          REPORT=$(cat health-report.txt 2>/dev/null || echo "звіт не сформувався")
          # jq строит JSON сам: в отчёте есть кавычки и переводы строк,
          # и склейка строкой дала бы битое тело запроса.
          jq -n --arg to "$ALERT_EMAIL" \
                --arg text "$(printf '%s\n\nЗапуск: %s\n' "$REPORT" "$RUN_URL")" \
            '{
               from: "CRESKO <no-reply@cres-ca.com>",
               to: [$to],
               subject: "CRESKO: сторож знайшов відмову",
               text: $text
             }' \
          | curl -sS --fail-with-body -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-
